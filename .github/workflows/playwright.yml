name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mock-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      CUSTOMER_INVALID_PASSWORD: ${{ secrets.CUSTOMER_INVALID_PASSWORD }}
      HYBRID_USER_EMAIL: ${{ secrets.HYBRID_USER_EMAIL }}
      HYBRID_USER_PASSWORD: ${{ secrets.HYBRID_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      # Visual baselines were generated on Windows, so CI only runs mock + contract tests.
      - run: npm run test:mock
        continue-on-error: true
      # Experiment: API login + UI. Does /account get past Cloudflare in CI?
      - run: npm run test:hybrid
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
